apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apihub-pro-ingress
  namespace: apihub-pro
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: api.apihub-pro.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apihub-pro-service
                port:
                  number: 80
