apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: apihub-pro-hpa
  namespace: apihub-pro
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apihub-pro-gateway
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 180
